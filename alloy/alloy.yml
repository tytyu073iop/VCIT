logging {
	level  = "info"
	format = "logfmt"
}

// The app ships its console output here over OTLP:
// OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://alloy:4318/v1/logs
otelcol.receiver.otlp "app" {
	grpc {
		endpoint = "0.0.0.0:4317"
	}

	http {
		endpoint = "0.0.0.0:4318"
	}

	output {
		logs = [otelcol.exporter.debug.stdout.input]
	}
}

// No log backend yet (Loki comes later), so records are echoed to this
// container's stdout: `docker logs <alloy>` shows what the app sent.
otelcol.exporter.debug "stdout" {
	verbosity = "normal"
}

