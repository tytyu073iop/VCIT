services:
  vcit:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    env_file:
      - secrets.env
    environment:
      OTEL_SERVICE_NAME: vcit
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://alloy:4318/v1/logs
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: prometheus
      USE_MOCK_AI: true
    depends_on:
      - jaeger
      - alloy
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 4317:4317
      - 4318:4318
      - 16686:16686
  alloy:
    image: grafana/alloy:latest
    ports:
      # Host alloy-lin already owns 12345; use 12346 for the container UI.
      - "12346:12345"
      # Host-side OTLP/HTTP intake; 4318 itself belongs to Jaeger above.
      - "14318:4318"
    volumes:
      - ./alloy/alloy.yml:/etc/alloy/config.alloy
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      # otelcol.exporter.debug is still experimental.
      - --stability.level=experimental
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'   # allows hot reload of config
  # Single-binary Loki with the image's built-in local config
  # (/etc/loki/local-config.yaml): filesystem storage, auth off.
  loki:
    image: grafana/loki:3.7.8
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
  grafana:
    image: grafana/grafana:12.4.12
    ports:
      - "3000:3000"
    environment:
      # Browse and edit dashboards without a login on localhost; data source is provisioned.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

volumes:
  prometheus-data:
  alloy-data:
  loki-data:
  grafana-data:
